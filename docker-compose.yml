services:
  api:
    build:
      context: ./api
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_DIR: /app/storage
      DATABASE_PATH: /app/storage/jobs.db
      TEMP_ROOT: /tmp/shorts-maker
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      YTDLP_TIMEOUT_SECONDS: ${YTDLP_TIMEOUT_SECONDS:-300}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  web-check:
    profiles: ["tools"]
    build:
      context: ./web
      target: checks
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
