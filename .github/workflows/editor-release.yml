name: Verify editor release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: editor-release-candidate
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EDITOR_RELEASE_TAG: editor-v4-render-parity-20260901-5
  EDITOR_RELEASE_BUILD_ROLE_ARN: ${{ vars.EDITOR_RELEASE_BUILD_ROLE_ARN }}
  EDITOR_RELEASE_VERIFIER_ROLE_ARN: ${{ vars.EDITOR_RELEASE_VERIFIER_ROLE_ARN }}
  EDITOR_RELEASE_ECR_REPOSITORY_URI: ${{ vars.EDITOR_RELEASE_ECR_REPOSITORY_URI }}
  EDITOR_TEST_JOB_QUEUE: ${{ vars.EDITOR_TEST_JOB_QUEUE || 'shorts-mvp-editor-test' }}
  EDITOR_TEST_TEMPLATE_JOB_DEFINITION: ${{ vars.EDITOR_TEST_TEMPLATE_JOB_DEFINITION || 'shorts-mvp-editor-test-template' }}
  EDITOR_PRODUCTION_TEMPLATE_JOB_DEFINITION: ${{ vars.EDITOR_PRODUCTION_TEMPLATE_JOB_DEFINITION || 'shorts-mvp-rerender-fargate-production' }}
  EDITOR_RELEASE_REGISTRAR_FUNCTION: ${{ vars.EDITOR_RELEASE_REGISTRAR_FUNCTION || 'shorts-mvp-editor-release-registrar-production' }}
  EDITOR_TEST_SUPABASE_PROJECT_REF: ${{ vars.EDITOR_TEST_SUPABASE_PROJECT_REF }}
  PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
  EDITOR_RELEASE_RENDER_SPEC_VERSION: "4"
  EDITOR_RELEASE_CAPTION_RENDER_SPEC_VERSION: "4"

jobs:
  build:
    # A mutable branch is never a release identity. AWS independently verifies
    # this exact protected tag before it allows an image push.
    if: github.ref == 'refs/tags/editor-v4-render-parity-20260901-5'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
      font_manifest_sha256: ${{ steps.font-manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/aws/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-dev.txt

      - name: Install verification dependencies
        run: |
          python -m pip install -r worker/requirements-dev.txt
          npm ci --prefix web
          npm ci --prefix infra/aws

      - name: Run the complete repository gate
        env:
          WORKER_PYTHON: python
          WORKER_RUFF: ruff
        run: make verify

      - name: Validate release configuration
        run: |
          test "$GITHUB_REF" = "refs/tags/$EDITOR_RELEASE_TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_PROTECTED" = "true"
          test -n "$EDITOR_RELEASE_BUILD_ROLE_ARN"
          test -n "$EDITOR_RELEASE_ECR_REPOSITORY_URI"
          test -n "$EDITOR_TEST_JOB_QUEUE"
          test -n "$EDITOR_TEST_TEMPLATE_JOB_DEFINITION"
          test -n "$EDITOR_PRODUCTION_TEMPLATE_JOB_DEFINITION"
          test -n "$EDITOR_RELEASE_REGISTRAR_FUNCTION"
          test -n "$EDITOR_TEST_SUPABASE_PROJECT_REF"
          test -n "$PRODUCTION_SUPABASE_PROJECT_REF"
          test "$EDITOR_TEST_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git tag --points-at HEAD --format='%(refname:short)')" = "$EDITOR_RELEASE_TAG"

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.EDITOR_RELEASE_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve an existing immutable release tag on workflow retry
        id: existing-image
        run: |
          set -euo pipefail
          repository_name="${EDITOR_RELEASE_ECR_REPOSITORY_URI#*/}"
          digest="$(aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="editor-release-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish the immutable render image once
        id: build
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: worker
          target: render
          platforms: linux/amd64
          push: true
          build-args: |
            WORKER_SOURCE_GIT_SHA=${{ github.sha }}
          # ECR basic scanning cannot scan the OCI index emitted for build
          # provenance. Publish one linux/amd64 image manifest so the digest
          # that is scanned is exactly the digest later registered in Batch.
          provenance: false
          tags: ${{ env.EDITOR_RELEASE_ECR_REPOSITORY_URI }}:editor-release-${{ github.sha }}
          cache-from: type=gha,scope=editor-release-render
          cache-to: type=gha,mode=max,scope=editor-release-render

      - name: Select the one immutable release digest
        id: image
        env:
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-${BUILT_DIGEST:-}}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository_name="${EDITOR_RELEASE_ECR_REPOSITORY_URI#*/}"
          observed="$(aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="editor-release-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          test "$observed" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify ECR scan and resolve isolated resources
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          repository_name="${EDITOR_RELEASE_ECR_REPOSITORY_URI#*/}"
          # The manifest can become visible before scan-on-push is ready.
          # Retry only the waiter; never bypass the scan result.
          scan_ready=false
          for attempt in {1..12}; do
            if aws ecr wait image-scan-complete \
              --repository-name "$repository_name" \
              --image-id imageDigest="$IMAGE_DIGEST"; then
              scan_ready=true
              break
            fi
            echo "ECR scan is not ready yet (attempt ${attempt}/12)."
            sleep 10
          done
          test "$scan_ready" = "true"
          critical="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$repository_name" \
              --image-id imageDigest="$IMAGE_DIGEST" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
              --output text
          )"
          test "$critical" = "0" || test "$critical" = "None"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "EDITOR_TEST_BUCKET_NAME=shorts-mvp-editor-test-${account_id}-${AWS_REGION}" >> "$GITHUB_ENV"

      - name: Resolve the exact v4 font manifest from the tested image
        id: font-manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="${EDITOR_RELEASE_ECR_REPOSITORY_URI}@${IMAGE_DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint python "$image" \
            -m shorts_worker editor-font-manifest > font-manifest.json
          jq -e '
            def expected_files: {
              "pretendard":"Pretendard-Bold.woff2",
              "noto-sans-kr":"NotoSansKR-Variable.ttf",
              "do-hyeon":"DoHyeon-Regular.ttf",
              "jua":"Jua-Regular.ttf",
              "jalnan-2":"Jalnan2-Regular.woff2",
              "cafe24-anemone":"Cafe24Anemone-Bold.woff",
              "cafe24-pro-up":"Cafe24ProUp-Regular.woff2",
              "sandbox-aggro":"SandboxAggro-Bold.ttf",
              "galmuri-9":"Galmuri9-Regular.ttf",
              "black-han-sans":"BlackHanSans-Regular.ttf",
              "godo":"Godo-Bold.ttf",
              "gmarket-sans":"GmarketSans-Bold.ttf",
              "nanum-square-neo":"NanumSquareNeo-Bold.ttf",
              "s-core-dream":"SCoreDream-ExtraBold.otf",
              "suit":"SUIT-Bold.woff2",
              "spoqa-han-sans-neo":"SpoqaHanSansNeo-Bold.woff2",
              "noto-serif-kr":"NotoSerifKR-Variable.ttf",
              "nanum-myeongjo":"NanumMyeongjo-Bold.ttf",
              "ridi-batang":"RIDIBatang-Regular.woff",
              "paperlogy":"Paperlogy-7Bold.ttf"
            };
            def font_root: "/app/worker/shorts_worker/assets/editor_fonts/";
            (.sha256 | test("^[0-9a-f]{64}$"))
            and (.fallbackDetected == false)
            and (.entries | type == "array" and length == 20)
            and ([.entries[].fontId] | sort) == (expected_files | keys | sort)
            and ([.entries[] | select(
              (keys | sort) != (["cssToAssBaselineOffsetEm","cssToAssScale","fontId","postscriptName","resolvedPath","sha256","titleBaselineOffsetEm","wordSpaceAdvanceEm"] | sort)
              or (.sha256 | test("^[0-9a-f]{64}$") | not)
              or (.postscriptName | type != "string" or length == 0)
              or (.resolvedPath != (font_root + expected_files[.fontId]))
              or (.resolvedPath | contains(".."))
              or (.cssToAssScale | type != "number" or . <= 0 or . > 1.2)
              or (.cssToAssBaselineOffsetEm | type != "number" or . < -0.25 or . > 0.25)
              or (.titleBaselineOffsetEm | type != "number" or . < -0.25 or . > 0.75)
              or (.wordSpaceAdvanceEm | type != "number" or . <= 0 or . > 1)
            )] | length == 0)
          ' font-manifest.json
          canonical_hash="$(
            jq -cSj \
              '{fallbackDetected,entries:(.entries | sort_by(.fontId))}' \
              font-manifest.json \
              | sha256sum \
              | cut -d ' ' -f 1
          )"
          manifest_hash="$(jq -r '.sha256' font-manifest.json)"
          test "$canonical_hash" = "$manifest_hash"
          echo "EDITOR_RELEASE_FONT_MANIFEST_SHA256=$manifest_hash" >> "$GITHUB_ENV"
          echo "sha256=$manifest_hash" >> "$GITHUB_OUTPUT"

  verify-and-register:
    needs: build
    if: github.ref == 'refs/tags/editor-v4-render-parity-20260901-5'
    environment: editor-v4-release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-dev.txt

      - name: Validate immutable verifier identity
        run: |
          test "$GITHUB_REF" = "refs/tags/$EDITOR_RELEASE_TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git tag --points-at HEAD --format='%(refname:short)')" = "$EDITOR_RELEASE_TAG"
          test -n "$EDITOR_RELEASE_VERIFIER_ROLE_ARN"
          test -n "$EDITOR_RELEASE_ECR_REPOSITORY_URI"
          test -n "$EDITOR_RELEASE_REGISTRAR_FUNCTION"
          test -n "$EDITOR_TEST_SUPABASE_PROJECT_REF"
          test -n "$PRODUCTION_SUPABASE_PROJECT_REF"
          test "$EDITOR_TEST_SUPABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF"

      - name: Install browser parity dependencies
        run: |
          python -m pip install -r worker/requirements-dev.txt
          npm ci --prefix web

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.EDITOR_RELEASE_VERIFIER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Re-verify immutable image and font contract
        id: build
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          EXPECTED_FONT_MANIFEST_SHA256: ${{ needs.build.outputs.font_manifest_sha256 }}
        run: |
          test "$IMAGE_DIGEST" = "$(aws ecr describe-images --repository-name "${EDITOR_RELEASE_ECR_REPOSITORY_URI#*/}" --image-ids imageTag="editor-release-${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
          critical="$(aws ecr describe-image-scan-findings --repository-name "${EDITOR_RELEASE_ECR_REPOSITORY_URI#*/}" --image-id imageDigest="$IMAGE_DIGEST" --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)"
          test "$critical" = "0" || test "$critical" = "None"
          image="${EDITOR_RELEASE_ECR_REPOSITORY_URI}@${IMAGE_DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint python "$image" -m shorts_worker editor-font-manifest > font-manifest.json
          test "$(jq -r '.sha256' font-manifest.json)" = "$EXPECTED_FONT_MANIFEST_SHA256"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "EDITOR_RELEASE_FONT_MANIFEST_SHA256=$EXPECTED_FONT_MANIFEST_SHA256" >> "$GITHUB_ENV"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "EDITOR_TEST_BUCKET_NAME=shorts-mvp-editor-test-${account_id}-${AWS_REGION}" >> "$GITHUB_ENV"

      - name: Apply additive migrations only to the isolated Supabase project
        env:
          DATABASE_URL: ${{ secrets.EDITOR_TEST_DATABASE_URL }}
          NON_PRODUCTION_DATABASE_FINGERPRINT: ${{ secrets.EDITOR_TEST_DATABASE_FINGERPRINT }}
        run: |
          test -n "$DATABASE_URL"
          node -e '
            const value = process.env.DATABASE_URL || "";
            const testRef = process.env.EDITOR_TEST_SUPABASE_PROJECT_REF || "";
            const productionRef = process.env.PRODUCTION_SUPABASE_PROJECT_REF || "";
            if (!value.includes(testRef) || value.includes(productionRef)) {
              throw new Error("isolated Supabase identity check failed");
            }
          '
          # Replaying every historical migration is unsafe after later schema
          # changes alter old conflict keys. The isolated editor probe only
          # needs the additive editor release, outbox, and caption contracts.
          node scripts/apply-supabase.mjs --non-production \
            202607310003_editor_release_channels.sql \
            202608010001_editor_render_canary_outbox.sql \
            202608080001_subtitle_templates_admin_canary.sql \
            202608110001_editor_subtitle_editing_capability.sql \
            202608240002_unified_template_subtitles_canary_flag.sql \
            202608260007_editor_render_spec_v4_release_control.sql \
            202608260008_editor_release_probe_attestation.sql \
            202608270001_fix_editor_release_object_cardinality.sql \
            202608280001_file_upload_render_release_binding.sql \
            202608280002_file_upload_render_release_binding_validate.sql

      - name: Ask the trusted registrar to create the isolated probe
        id: isolated-probe
        env:
          EDITOR_RELEASE_GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          oidc_response="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=editor-v4-release-registrar"
          )"
          github_oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          payload="$(jq -cn \
            --arg gitSha "$EDITOR_RELEASE_GIT_SHA" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg fontManifestSha256 "$EDITOR_RELEASE_FONT_MANIFEST_SHA256" \
            --arg githubOidcToken "$github_oidc_token" \
            '{
              action:"startProbe",gitSha:$gitSha,imageDigest:$imageDigest,
              fontManifestSha256:$fontManifestSha256,
              githubOidcToken:$githubOidcToken
            }')"
          metadata="$(aws lambda invoke \
            --function-name "$EDITOR_RELEASE_REGISTRAR_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --payload "$payload" response.json)"
          jq -e 'has("FunctionError") | not' <<< "$metadata"
          jq -e '
            .state == "job_submitted"
            and (.probeRunId | test("^[0-9a-f-]{36}$"))
            and (.nonce | test("^[0-9a-f]{32}$"))
            and (.isolatedBatchJobId | test("^[0-9a-f-]{36}$"))
            and (.artifactUri | startswith("s3://"))
          ' response.json
          job_id="$(jq -er '.isolatedBatchJobId' response.json)"
          echo "probe_run_id=$(jq -er '.probeRunId' response.json)" >> "$GITHUB_OUTPUT"
          echo "nonce=$(jq -er '.nonce' response.json)" >> "$GITHUB_OUTPUT"
          test -n "$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "artifact_uri=$(jq -er '.artifactUri' response.json)" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 225); do
            status="$(
              aws batch describe-jobs \
                --jobs "$job_id" \
                --query 'jobs[0].status' \
                --output text
            )"
            case "$status" in
              SUCCEEDED)
                break
                ;;
              FAILED)
                aws batch describe-jobs --jobs "$job_id"
                exit 1
                ;;
            esac
            if test "$attempt" = "225"; then
              aws batch describe-jobs --jobs "$job_id"
              exit 1
            fi
            sleep 12
          done

      - name: Validate the v4 probe evidence contract
        id: probe-evidence
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          ARTIFACT_URI: ${{ steps.isolated-probe.outputs.artifact_uri }}
        run: |
          set -euo pipefail
          artifact_without_scheme="${ARTIFACT_URI#s3://}"
          artifact_bucket="${artifact_without_scheme%%/*}"
          artifact_key="${artifact_without_scheme#*/}"
          test "$artifact_bucket" = "$EDITOR_TEST_BUCKET_NAME"
          manifest_version="$(aws s3api head-object \
            --bucket "$artifact_bucket" --key "$artifact_key" \
            --query VersionId --output text)"
          test -n "$manifest_version"
          test "$manifest_version" != "None"
          aws s3api get-object \
            --bucket "$artifact_bucket" --key "$artifact_key" \
            --version-id "$manifest_version" probe-manifest.json >/dev/null
          echo "manifest_version=$manifest_version" >> "$GITHUB_OUTPUT"
          jq -e \
            --arg gitSha "$GITHUB_SHA" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg fontManifestSha256 "$EDITOR_RELEASE_FONT_MANIFEST_SHA256" \
            --arg nonce "${{ steps.isolated-probe.outputs.nonce }}" \
            --arg probeRunId "${{ steps.isolated-probe.outputs.probe_run_id }}" \
            --arg batchJobId "${{ steps.isolated-probe.outputs.job_id }}" '
            .schemaVersion == 2
            and .gitSha == $gitSha
            and .workerImageDigest == $imageDigest
            and .documentVersion == 3
            and .renderSpecVersion == 4
            and .captionRenderSpecVersion == 4
            and .fontManifestSha256 == $fontManifestSha256
            and .runtimeIdentity == {
              sourceGitSha:$gitSha,
              imageDigest:$imageDigest,
              renderSpecVersion:"4",
              captionRenderSpecVersion:"4",
              fontManifestSha256:$fontManifestSha256
            }
            and .checks["runtime-identity"] == true
            and .checks["render-spec-v4"] == true
            and .checks["caption-render-spec-v4"] == true
            and .checks["worker-title-compositor-parity"] == true
            and .checks["worker-caption-noop-parity"] == true
            and .checks["font-manifest"] == true
            and .checks["font-fallback"] == true
            and .checks["browser-parity-worker-matrix"] == true
            and .fontManifest.sha256 == $fontManifestSha256
            and .fontManifest.fallbackDetected == false
            and .probeIdentity == {
              nonce:$nonce,probeRunId:$probeRunId,batchJobId:$batchJobId
            }
            and ([.artifacts[] | select(
              (.relativeName | type != "string")
              or (.versionId | type != "string" or length == 0)
              or (.sha256 | test("^[0-9a-f]{64}$") | not)
            )] | length == 0)
          ' probe-manifest.json
          jq -S '.fontManifest' probe-manifest.json \
            | diff -u <(jq -S . font-manifest.json) -

      - name: Prove full Chromium compiler and stored-spec parity within 2px
        id: browser-parity
        env:
          ARTIFACT_URI: ${{ steps.isolated-probe.outputs.artifact_uri }}
        run: |
          set -euo pipefail
          matrix_uri="${ARTIFACT_URI%/manifest.json}/browser-parity/matrix.json"
          mkdir -p worker-matrix/frames browser-worker-parity
          artifact_without_scheme="${ARTIFACT_URI#s3://}"
          artifact_bucket="${artifact_without_scheme%%/*}"
          artifact_key="${artifact_without_scheme#*/}"
          artifact_prefix="${artifact_key%/manifest.json}"
          matrix_version="$(jq -er '
            [.artifacts[] | select(.relativeName=="browser-parity/matrix.json")]
            | if length==1 then .[0].versionId else error("matrix version") end
          ' probe-manifest.json)"
          aws s3api get-object \
            --bucket "$artifact_bucket" \
            --key "$artifact_prefix/browser-parity/matrix.json" \
            --version-id "$matrix_version" \
            worker-matrix/matrix.json >/dev/null
          while IFS= read -r frame_name; do
            test "$(basename "$frame_name")" = "$frame_name"
            frame_relative="browser-parity/frames/${frame_name}"
            frame_version="$(jq -er --arg relative "$frame_relative" '
              [.artifacts[] | select(.relativeName==$relative)]
              | if length==1 then .[0].versionId else error("frame version") end
            ' probe-manifest.json)"
            aws s3api get-object \
              --bucket "$artifact_bucket" \
              --key "$artifact_prefix/$frame_relative" \
              --version-id "$frame_version" \
              "worker-matrix/frames/${frame_name}" >/dev/null
          done < <(
            jq -er '.cases[].workerFrameName | sub("^frames/"; "")' \
              worker-matrix/matrix.json
          )
          matrix_sha256="$(sha256sum worker-matrix/matrix.json | cut -d ' ' -f 1)"
          jq -e --argjson identity "$(jq -c '.runtimeIdentity' probe-manifest.json)" '
            .schemaVersion == 1
            and .renderer == "isolated-linux-worker-v4"
            and .runtimeIdentity == $identity
            and .caseCount == 66
            and (.cases | length) == 66
            and (.fontIds | unique | length) == 20
            and ([.cases[].workerFrameSha256] | all(test("^[0-9a-f]{64}$")))
          ' worker-matrix/matrix.json
          test "$(jq -r '.browserParityMatrix.sha256' probe-manifest.json)" = "$matrix_sha256"
          PYTHONPATH=worker python \
            scripts/run-editor-v4-browser-worker-parity-matrix.py \
            --matrix worker-matrix/matrix.json \
            --matrix-source "$matrix_uri" \
            --worker-frames-root worker-matrix/frames \
            --worker-manifest probe-manifest.json \
            --evidence-directory browser-worker-parity \
            --report browser-worker-parity/report.json
          jq -e '
            .schemaVersion == 2
            and .caseCount == 66
            and (.fontIds | unique | length) == 20
            and .maximumAllowedErrorPixels == 2
            and .maximumDomErrorPixels <= 2
            and .maximumPixelErrorPixels <= 2
            and .checks["browser-worker-visual-parity"] == true
            and .checks.actualChromium == true
            and .checks.browserTemplateCompilerParity == true
            and .checks.storedSpecConsumerParity == true
            and .checks.allEditorFontsBothCaptionModes == true
            and .checks.allEditorFontsTitleMatrix == true
            and .checks.pureLanguageBoundaryMatrix == true
          ' browser-worker-parity/report.json
          echo "maximum_dom_error=$(jq -r '.maximumDomErrorPixels' browser-worker-parity/report.json)" >> "$GITHUB_OUTPUT"
          echo "maximum_pixel_error=$(jq -r '.maximumPixelErrorPixels' browser-worker-parity/report.json)" >> "$GITHUB_OUTPUT"

      - name: Register the verified candidate for administrator approval
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROBE_RUN_ID: ${{ steps.isolated-probe.outputs.probe_run_id }}
          PROBE_NONCE: ${{ steps.isolated-probe.outputs.nonce }}
          ISOLATED_JOB_ID: ${{ steps.isolated-probe.outputs.job_id }}
        run: |
          set -euo pipefail
          oidc_response="$(
            curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=editor-v4-release-registrar"
          )"
          github_oidc_token="$(jq -er '.value' <<< "$oidc_response")"
          report_json="$(jq -cS \
            --arg probeRunId "$PROBE_RUN_ID" \
            --arg nonce "$PROBE_NONCE" \
            --arg batchJobId "$ISOLATED_JOB_ID" \
            --arg gitSha "$GITHUB_SHA" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg githubRunId "$GITHUB_RUN_ID" \
            --arg githubRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg releaseRef "$GITHUB_REF" '
            . + {releaseIdentity:{
              probeRunId:$probeRunId,nonce:$nonce,batchJobId:$batchJobId,
              gitSha:$gitSha,imageDigest:$imageDigest,
              githubRunId:$githubRunId,githubRunAttempt:$githubRunAttempt,
              workflowRef:$workflowRef,releaseRef:$releaseRef
            }}
          ' browser-worker-parity/report.json)"
          test "$(printf '%s' "$report_json" | wc -c | tr -d ' ')" -le 524288
          report_sha256="$(printf '%s' "$report_json" | sha256sum | cut -d ' ' -f 1)"
          payload="$(
            jq -cn \
              --arg gitSha "$GITHUB_SHA" \
              --arg imageDigest "$IMAGE_DIGEST" \
              --arg probeRunId "$PROBE_RUN_ID" \
              --arg browserParityReportJson "$report_json" \
              --arg browserParityReportSha256 "$report_sha256" \
              --arg githubOidcToken "$github_oidc_token" \
              --arg fontManifestSha256 "$EDITOR_RELEASE_FONT_MANIFEST_SHA256" \
              '{
                action:"finalizeRelease",gitSha:$gitSha,
                imageDigest:$imageDigest,probeRunId:$probeRunId,
                fontManifestSha256:$fontManifestSha256,
                browserParityReportJson:$browserParityReportJson,
                browserParityReportSha256:$browserParityReportSha256,
                githubOidcToken:$githubOidcToken
              }'
          )"
          metadata="$(
            aws lambda invoke \
              --function-name "$EDITOR_RELEASE_REGISTRAR_FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --payload "$payload" \
              response.json
          )"
          echo "$metadata"
          jq -e 'has("FunctionError") | not' <<< "$metadata"
          jq -e '
            .status == "canary_ready"
            and (.releaseId | length > 0)
            and (.productionJobDefinitionArn | startswith("arn:aws:batch:"))
            and (.projectTargets | keys | length == 5)
          ' response.json
          {
            echo "### Browser compiler → isolated Linux worker parity"
            echo
            echo "- cases: 66"
            echo "- title fonts: 20/20"
            echo "- pop/highlight fonts: 20/20 in both modes"
            echo "- maximum DOM error: ${{ steps.browser-parity.outputs.maximum_dom_error }}px"
            echo "- maximum pixel error: ${{ steps.browser-parity.outputs.maximum_pixel_error }}px"
            echo "- allowed: 2px"
            echo
            echo "### Registrar-owned production definitions"
            echo
            jq -r '.projectTargets | to_entries[] | "- \(.key): `\(.value.jobDefinitionArn)` → `\(.value.jobQueueArn)`"' response.json
          } >> "$GITHUB_STEP_SUMMARY"
