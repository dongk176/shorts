name: Build and publish worker

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: shorts-worker-production
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r worker/requirements-dev.txt
      - run: ruff check worker
      - run: pytest -q worker/tests
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKER_BUILD_ROLE_ARN }}
          aws-region: ap-northeast-2
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REPOSITORY_URI }}:latest
            ${{ vars.AWS_ECR_REPOSITORY_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
