name: Build and publish worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: shorts-worker-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_WORKER_BUILD_ROLE_ARN: ${{ vars.AWS_WORKER_BUILD_ROLE_ARN || 'arn:aws:iam::181651591905:role/ShortsMvpCompute-producti-GithubWorkerBuildRole76A3-XtOG3GOjswIm' }}
  AWS_ECR_REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI || '181651591905.dkr.ecr.ap-northeast-2.amazonaws.com/shorts-mvp-worker-production' }}

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r worker/requirements-dev.txt
      - run: ruff check worker
      - run: pytest -q worker/tests
      - name: Validate deployment configuration
        run: |
          test -n "$AWS_WORKER_BUILD_ROLE_ARN"
          test -n "$AWS_ECR_REPOSITORY_URI"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_WORKER_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ECR_REPOSITORY_URI }}:latest
            ${{ env.AWS_ECR_REPOSITORY_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
